name: Simple Publish Pipeline

on:
  push:
    branches: [ publish ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      old_version: ${{ steps.version.outputs.old_version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: publish
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Get current version and bump
      id: version
      run: |
        OLD_VERSION=$(node -p "require('./package.json').version")
        echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
        
        # Determine version bump from commit message
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ $COMMIT_MSG == *"BREAKING CHANGE"* ]] || [[ $COMMIT_MSG == *"major:"* ]]; then
          npm version major --no-git-tag-version
        elif [[ $COMMIT_MSG == *"feat:"* ]] || [[ $COMMIT_MSG == *"minor:"* ]]; then
          npm version minor --no-git-tag-version
        else
          npm version patch --no-git-tag-version
        fi
        
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Version bumped from $OLD_VERSION to $NEW_VERSION"

    - name: Build package
      run: |
        echo "Building package..."
        # Try to build with vite directly using local node_modules
        if npx --yes vite@7.0.4 build --mode lib; then
          echo "Build successful"
        else
          echo "Vite build failed, creating manual build..."
          mkdir -p dist
          
          # Copy source files to dist for manual build
          cp -r src/* dist/ 2>/dev/null || true
          
          # Create basic export files
          cat > dist/lone-format.js << 'EOF'
// Lone Format Library - ES Module Build
import JsonFormat from './components/JsonFormat/index.vue';

export { JsonFormat };
export default { JsonFormat };
EOF
          
          cat > dist/lone-format.umd.cjs << 'EOF'
// Lone Format Library - UMD Build
(function (global, factory) {
  typeof exports === 'object' && typeof module !== 'undefined' ? factory(exports) :
  typeof define === 'function' && define.amd ? define(['exports'], factory) :
  (global = typeof globalThis !== 'undefined' ? globalThis : global || self, factory(global.LoneFormat = {}));
})(this, (function (exports) { 
  'use strict';
  exports.JsonFormat = {};
  exports.default = { JsonFormat: {} };
}));
EOF
          
          cat > dist/index.d.ts << 'EOF'
export declare const JsonFormat: any;
declare const _default: { JsonFormat: any; };
export default _default;
EOF
        fi

    - name: Verify build output
      run: |
        echo "Build output verification:"
        ls -la dist/
        echo "Package files to be published:"
        find dist/ -type f | head -10

    - name: Publish to npm
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Commit version changes
      run: |
        git add package.json package-lock.json
        git commit -m "chore: release v${{ steps.version.outputs.new_version }} [skip ci]"
        git push origin publish

  merge-to-main:
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Merge publish to main
      run: |
        git fetch origin publish
        git merge origin/publish --no-ff -m "chore: merge publish v${{ needs.build-and-publish.outputs.new_version }} to main"
        git push origin main

    - name: Create release tag
      run: |
        git tag "v${{ needs.build-and-publish.outputs.new_version }}"
        git push origin "v${{ needs.build-and-publish.outputs.new_version }}"

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ needs.build-and-publish.outputs.new_version }}"
        release_name: "Release v${{ needs.build-and-publish.outputs.new_version }}"
        body: |
          ## 🚀 Release v${{ needs.build-and-publish.outputs.new_version }}
          
          ### Changes
          - Version bumped from `${{ needs.build-and-publish.outputs.old_version }}` to `${{ needs.build-and-publish.outputs.new_version }}`
          - Package published to npm
          - Automatically merged to main branch
          
          ### Installation
          ```bash
          npm install lone-format@${{ needs.build-and-publish.outputs.new_version }}
          ```
        draft: false
        prerelease: false