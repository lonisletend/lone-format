name: Auto Publish and Merge

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write  # Required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Determine version bump type
      id: version_type
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
        else
          # Auto-determine from commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $COMMIT_MSG == *"BREAKING CHANGE"* ]] || [[ $COMMIT_MSG == *"major:"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ $COMMIT_MSG == *"feat:"* ]] || [[ $COMMIT_MSG == *"minor:"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Bump version on main branch
      id: bump_version
      run: |
        OLD_VERSION=$(node -p "require('./package.json').version")
        npm version ${{ steps.version_type.outputs.type }} --no-git-tag-version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Commit version bump to main
      run: |
        git add package.json package-lock.json
        git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
        git push origin main

    - name: Merge main to publish branch
      run: |
        echo "Fetching publish branch..."
        git fetch origin publish:publish || git checkout -b publish
        
        echo "Switching to publish branch..."
        git checkout publish
        
        echo "Merging main into publish..."
        git merge main --no-ff -m "chore: merge main v${{ steps.bump_version.outputs.new_version }} to publish [skip ci]"
        
        echo "Pushing publish branch..."
        git push origin publish

    - name: Build library
      run: |
        echo "Building library on publish branch..."
        npm run build:lib

    - name: Publish to npm
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create Git Tag
      run: |
        git tag "v${{ steps.bump_version.outputs.new_version }}"
        git push origin "v${{ steps.bump_version.outputs.new_version }}"

  notify:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify success
      if: needs.publish.result == 'success'
      run: |
        echo "✅ Successfully published to npm!"
        echo "::notice title=Publication Success::Version ${{ needs.publish.outputs.new_version }} published to npm and publish branch updated"
    
    - name: Notify failure
      if: needs.publish.result == 'failure'
      run: |
        echo "❌ Publication failed!"
        echo "::error title=Publication Failed::Check the logs for details"