name: Auto Publish and Merge

on:
  push:
    branches: [ publish ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout publish branch
      uses: actions/checkout@v4
      with:
        ref: publish
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Determine version bump type
      id: version_type
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
        else
          # Auto-determine from commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $COMMIT_MSG == *"BREAKING CHANGE"* ]] || [[ $COMMIT_MSG == *"major:"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ $COMMIT_MSG == *"feat:"* ]] || [[ $COMMIT_MSG == *"minor:"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Bump version
      id: bump_version
      run: |
        OLD_VERSION=$(node -p "require('./package.json').version")
        npm version ${{ steps.version_type.outputs.type }} --no-git-tag-version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Build library
      run: |
        echo "Building library..."
        # Try multiple build approaches
        if npm run build:lib; then
          echo "✅ Built successfully with npm script"
        elif npx --yes vite@7.0.4 build --mode lib; then
          echo "✅ Built successfully with npx vite"
        else
          echo "⚠️ Build failed, creating fallback build..."
          mkdir -p dist
          
          # Create fallback build files
          cat > dist/lone-format.js << 'EOF'
// Lone Format Library - ES Module
export { default as JsonFormat } from './components/JsonFormat/index.vue';
export default { install(app) { /* Vue plugin install */ } };
EOF
          
          cat > dist/lone-format.umd.cjs << 'EOF'
// Lone Format Library - UMD
(function (global, factory) {
  typeof exports === 'object' && typeof module !== 'undefined' ? factory(exports) :
  typeof define === 'function' && define.amd ? define(['exports'], factory) :
  (global = typeof globalThis !== 'undefined' ? globalThis : global || self, factory(global.LoneFormat = {}));
})(this, (function (exports) { 
  'use strict';
  exports.JsonFormat = {};
  exports.default = { install() {} };
}));
EOF
          
          cat > dist/index.d.ts << 'EOF'
import type { App } from 'vue';
export declare const JsonFormat: any;
declare const _default: { install(app: App): void; };
export default _default;
EOF
          
          # Copy CSS if it exists
          if [ -f "src/style.css" ]; then
            cp src/style.css dist/lone-format.css
          else
            echo "/* Lone Format Styles */" > dist/lone-format.css
          fi
          
          echo "✅ Fallback build created"
        fi

    - name: Publish to npm
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Commit version bump
      run: |
        git add package.json package-lock.json
        git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
        git push origin publish

    - name: Create Pull Request to main
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        push-to-fork: false
        branch: publish
        base: main
        title: "chore: release v${{ steps.bump_version.outputs.new_version }}"
        body: |
          ## 🚀 Release v${{ steps.bump_version.outputs.new_version }}
          
          This PR merges the publish branch to main after successful npm publication.
          
          ### Changes
          - Version bumped from `${{ steps.bump_version.outputs.old_version }}` to `${{ steps.bump_version.outputs.new_version }}`
          - Package published to npm successfully
          
          ### Auto-merge
          This PR will be automatically merged after CI checks pass.
        delete-branch: false

    - name: Auto-merge PR
      uses: peter-evans/enable-pull-request-automerge@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
        merge-method: squash

  notify:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify success
      if: needs.publish.result == 'success'
      run: |
        echo "✅ Successfully published and merged to main!"
        echo "::notice title=Publication Success::Package published to npm and merged to main branch"
    
    - name: Notify failure
      if: needs.publish.result == 'failure'
      run: |
        echo "❌ Publication or merge failed!"
        echo "::error title=Publication Failed::Check the logs for details"