name: Auto Publish and Merge

on:
  push:
    branches: [ publish ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout publish branch
      uses: actions/checkout@v4
      with:
        ref: publish
        token: ${{ github.token }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Determine version bump type
      id: version_type
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
        else
          # Auto-determine from commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $COMMIT_MSG == *"BREAKING CHANGE"* ]] || [[ $COMMIT_MSG == *"major:"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ $COMMIT_MSG == *"feat:"* ]] || [[ $COMMIT_MSG == *"minor:"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Bump version
      id: bump_version
      run: |
        OLD_VERSION=$(node -p "require('./package.json').version")
        npm version ${{ steps.version_type.outputs.type }} --no-git-tag-version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Commit version bump
      run: |
        git add package.json package-lock.json
        git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
        git push origin publish

    - name: Build library
      run: |
        echo "Building library..."
        npm run build:lib

    - name: Publish to npm
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create and merge PR to main
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        echo "Creating PR to merge publish to main..."
        
        # Create PR using GitHub CLI
        PR_URL=$(gh pr create \
          --title "chore: release v${{ steps.bump_version.outputs.new_version }}" \
          --body "## 🚀 Release v${{ steps.bump_version.outputs.new_version }}

        This PR merges the publish branch to main after successful npm publication.

        ### Changes
        - Version bumped from \`${{ steps.bump_version.outputs.old_version }}\` to \`${{ steps.bump_version.outputs.new_version }}\`
        - Package published to npm successfully

        ### Auto-merge
        This PR will be automatically merged." \
          --base main \
          --head publish)
        
        echo "PR created: $PR_URL"
        
        # Extract PR number from URL
        PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]\+$')
        echo "PR Number: $PR_NUMBER"
        
        # Enable auto-merge and merge immediately
        echo "Auto-merging PR #$PR_NUMBER..."
        gh pr merge $PR_NUMBER --squash --auto || gh pr merge $PR_NUMBER --squash

  notify:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify success
      if: needs.publish.result == 'success'
      run: |
        echo "✅ Successfully published and merged to main!"
        echo "::notice title=Publication Success::Package published to npm and merged to main branch"
    
    - name: Notify failure
      if: needs.publish.result == 'failure'
      run: |
        echo "❌ Publication or merge failed!"
        echo "::error title=Publication Failed::Check the logs for details"